/* RENOVA · design system — tokens
   Fuente única de colores, tipografía, espacios, radios y sombras para ebooks, landings y creativos.
   Paleta = la del ebook (medida en el PDF). Landings, creativos y videos usan exactamente estos colores.
   Ver README.md para el uso de cada uno. */
:root{
  /* ---- Color: turquesa de marca (el de nachoportillo.com) */
  --rnv-turquesa:#14B1C7;          /* rellenos, líneas, números grandes, botones */
  --rnv-turquesa-titulo:#0E9DB2;   /* palabras destacadas en títulos, botón del ebook */
  --rnv-turquesa-oscuro:#0A7F90;   /* texto chico en turquesa (pills, etiquetas, links) */
  --rnv-turquesa-profundo:#075E6B; /* texto sobre fondo turquesa claro */
  --rnv-turquesa-fondo:#E8F6F8;    /* fondo de recuadros y tarjetas */
  --rnv-turquesa-borde:#CDEEF3;    /* bordes suaves */
  /* ---- Color: logo (solo portada y logo, no para texto corrido) */
  --rnv-azul:#0033A0;
  --rnv-rojo:#E63333;
  /* ---- Color: sello de garantía (solo el sello dorado) */
  --rnv-oro:#E2A928;
  --rnv-oro-claro:#F9DE7E;
  --rnv-oro-oscuro:#8A5A0B;
  /* ---- Color: neutros */
  --rnv-tinta:#141414;             /* títulos */
  --rnv-texto:#2A2F33;             /* cuerpo */
  --rnv-gris:#555C62;              /* bajadas, notas, texto secundario */
  --rnv-linea:#E3ECEE;             /* separadores */
  --rnv-fondo:#F4FAFB;             /* fondo alternativo de secciones */
  --rnv-oscuro:#141414;            /* barras, pie y recuadros oscuros (el negro del ebook) */
  --rnv-blanco:#FFFFFF;

  /* ---- Degradés y sombras */
  --rnv-degrade:linear-gradient(135deg,#14B1C7 0%,#0E9DB2 100%);   /* solo turquesas del ebook */
  --rnv-sombra:0 10px 30px rgba(20,20,20,.08);
  --rnv-sombra-fuerte:0 24px 54px rgba(20,20,20,.16);
  --rnv-sombra-boton:0 14px 30px rgba(20,177,199,.38),inset 0 -4px 0 rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.35);

  /* ---- Tipografía */
  --rnv-fuente:"InterW","Inter",system-ui,sans-serif;            /* todo el texto */
  --rnv-fuente-display:"InterTightW","Inter Tight","InterW",sans-serif; /* titulares de web y redes */

  /* Escala del ebook (A4, se lee en el celular: cuerpo mínimo 15 pt) */
  --rnv-pdf-portada:37pt;
  --rnv-pdf-h1:26pt;
  --rnv-pdf-h2:18pt;
  --rnv-pdf-h3:16pt;
  --rnv-pdf-cuerpo:16pt;
  --rnv-pdf-chico:13pt;
  --rnv-pdf-etiqueta:7.6pt;

  /* Escala web (landing) */
  --rnv-web-h1:clamp(46px,7vw,80px);
  --rnv-web-h2:clamp(28px,3.6vw,42px);
  --rnv-web-cuerpo:17px;
  --rnv-web-chico:14px;

  /* Escala redes (lienzo de 1080 px de ancho: se ve a ~36% en el celular) */
  --rnv-red-gancho:104px;   /* titular principal */
  --rnv-red-titulo:72px;
  --rnv-red-subtitulo:48px;
  --rnv-red-cuerpo:40px;    /* mínimo para que se lea en el celular */
  --rnv-red-etiqueta:28px;

  /* ---- Espacios y radios */
  --rnv-esp-1:8px; --rnv-esp-2:16px; --rnv-esp-3:24px; --rnv-esp-4:40px; --rnv-esp-5:64px;
  --rnv-radio:14px;
  --rnv-radio-grande:24px;
  --rnv-radio-pill:999px;

  /* ---- Página A4 del ebook */
  --rnv-a4-margen:21mm 17mm 17mm;

  /* ---- Zonas seguras de Instagram y Facebook en 1080×1920 (historias y reels) */
  --rnv-zona-arriba:250px;
  --rnv-zona-abajo:340px;
}

*{margin:0;padding:0;box-sizing:border-box}
body{width:var(--w);height:var(--h);overflow:hidden;position:relative;
 background:radial-gradient(ellipse 55% 50% at 50% 46%,rgba(20,177,199,.45),transparent 70%),
 radial-gradient(ellipse 80% 30% at 50% 100%,rgba(20,177,199,.15),transparent 70%),#0b1214}
.grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#14B1C7 1px,transparent 1px),linear-gradient(90deg,#14B1C7 1px,transparent 1px);background-size:60px 60px;
 mask-image:radial-gradient(ellipse at 50% 60%,#000 20%,transparent 70%)}
.st{position:absolute;inset:0;perspective:2400px}
.bk{position:absolute;transform-style:preserve-3d}
.fr{position:absolute;inset:0;border-radius:5px 16px 16px 5px;overflow:hidden;
 box-shadow:0 0 0 3px #14B1C7,0 0 0 8px rgba(20,177,199,.22),0 0 60px rgba(20,177,199,.7),50px 70px 100px rgba(0,0,0,.6)}
.fr img{width:100%;height:100%;object-fit:cover;display:block}
.fr::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(115deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 72%,rgba(255,255,255,.12))}
.fr::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4%;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.28),transparent)}
.sp{position:absolute;left:0;top:0;height:100%;transform-origin:left;transform:rotateY(90deg);backface-visibility:hidden;border-radius:4px;
 background:linear-gradient(90deg,#075E6B,#0E9DB2 45%,#14B1C7 55%,#075E6B);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.sp.r{left:auto;right:0;transform-origin:right;transform:rotateY(-90deg)}
.sp span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font:900 var(--fs) InterTightW,sans-serif;letter-spacing:.18em;color:#fff}
.pg{position:absolute;top:1.5%;bottom:1.5%;right:-1.5%;width:3%;background:repeating-linear-gradient(90deg,#f3f3f3 0 2px,#d9d9d9 2px 3px);transform:rotateY(90deg) translateZ(-2px);transform-origin:left}
.cn{position:absolute;width:6%;aspect-ratio:1;border:4px solid #F9FEFF;z-index:3;filter:drop-shadow(0 0 8px #14B1C7)}
.cn.a{left:-2.5%;top:-1.8%;border-right:0;border-bottom:0}.cn.b{right:-2.5%;bottom:-1.8%;border-left:0;border-top:0}
.shadow{position:absolute;height:70px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.75),transparent 70%)}
