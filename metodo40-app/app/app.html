<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0F10">
<title>MÉTODO 40 App</title>
<style>
/*TOKENS*/
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--m40-gris-claro);color:var(--m40-negro);font-size:16px;line-height:1.4;padding-bottom:90px}
button,input,select{font:inherit}
.top{background:var(--m40-negro);color:#fff;padding:14px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));display:flex;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top, 0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--m40-negro)}
.top img{height:26px;filter:brightness(0) invert(1)}
.top b{font-size:13px;letter-spacing:.14em;color:#fff;opacity:.85}
.top .who{font-size:13px;opacity:.75}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:28px;font-weight:900;letter-spacing:-.02em;text-transform:uppercase;line-height:1.05}
h1 span,h2 span{color:var(--m40-rojo)}
h2{font-size:19px;font-weight:900;text-transform:uppercase;margin:22px 0 10px}
.card{background:#fff;border:1px solid var(--m40-borde);border-radius:16px;padding:16px;margin:12px 0}
.muted{color:var(--m40-gris);font-size:14px}
label{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--m40-gris);margin:12px 0 6px}
input,select{width:100%;padding:12px;border:1px solid var(--m40-borde);border-radius:10px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--m40-rojo),var(--m40-rojo-oscuro));color:#fff;font-weight:900;font-size:16px;letter-spacing:.04em;text-transform:uppercase;margin-top:16px;cursor:pointer;text-align:center;text-decoration:none;
 box-shadow:0 0 0 2px #fff,0 0 0 4px var(--m40-rojo),0 8px 22px rgba(214,40,40,.35);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--m40-rojo),0 3px 10px rgba(214,40,40,.3)}
.btn:focus-visible,.chip:focus-visible,.obj:focus-visible{outline:3px solid var(--m40-rojo);outline-offset:3px}
.btn.sec{background:linear-gradient(135deg,var(--m40-grafito),var(--m40-negro));box-shadow:0 0 0 2px #fff,0 0 0 4px var(--m40-negro),0 8px 22px rgba(0,0,0,.25)}
.btn.ghost{background:#fff;color:var(--m40-negro);box-shadow:inset 0 0 0 2px var(--m40-negro)}
.pasos{display:flex;gap:6px;margin:4px 0 14px}.pasos i{flex:1;height:6px;border-radius:99px;background:var(--m40-borde)}.pasos i.on{background:linear-gradient(90deg,var(--m40-rojo),var(--m40-rojo-oscuro))}
.paso-k{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--m40-gris);text-transform:uppercase}
.navp{position:fixed;left:0;right:0;bottom:66px;padding:10px max(16px, env(safe-area-inset-left, 0px)) 10px max(16px, env(safe-area-inset-right, 0px));background:linear-gradient(transparent,var(--m40-gris-claro) 30%);display:flex;gap:10px;z-index:5}
.navp.solo{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
.navp .btn{margin:0}.navp .btn.ghost{flex:0 0 34%}
body.wiz{padding-bottom:170px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 16px;border-radius:999px;border:2px solid var(--m40-borde);background:#fff;font-weight:800;cursor:pointer;transition:.12s}
.chip.on{border-color:transparent;background:linear-gradient(135deg,var(--m40-rojo),var(--m40-rojo-oscuro));color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--m40-rojo)}
.chip.off{opacity:.45;cursor:not-allowed}
.obj{display:block;width:100%;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--m40-borde);background:#fff;margin:8px 0;cursor:pointer}
.obj b{display:block;font-size:17px}.obj.on{border-color:var(--m40-rojo);box-shadow:0 0 0 4px rgba(214,40,40,.18),0 8px 18px rgba(0,0,0,.08)}
.obj.off{opacity:.5;cursor:not-allowed}.obj small{color:var(--m40-gris)}
.hero{background:var(--m40-negro);color:#fff;border-radius:18px;padding:18px;margin:4px 0 12px}
.hero .k{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.hero .big{font-size:30px;font-weight:900;line-height:1.05;margin:4px 0}
.hero .pill{display:inline-block;background:var(--m40-rojo);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800;margin:6px 6px 0 0}
.alert{background:#FFF4F4;border:2px solid var(--m40-rojo);border-radius:14px;padding:14px;margin:12px 0}
.alert b{color:var(--m40-rojo-oscuro)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px}
.sec-h h2{margin:0}.sec-h span{font-size:13px;font-weight:700;color:var(--m40-gris)}
.ex{background:#fff;border:1px solid var(--m40-borde);border-radius:14px;padding:12px;margin:10px 0;display:grid;grid-template-columns:84px 1fr;gap:12px}
.ex img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--m40-gris-claro)}
.ex b{display:block;font-size:16px;line-height:1.2}
.ex .mus{font-size:13px;color:var(--m40-gris)}
.ex .dosis{display:inline-block;margin-top:6px;font-weight:800;color:var(--m40-rojo-oscuro);font-size:14px}
.ex .cambio{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;background:var(--m40-gris-claro);border-radius:6px;padding:2px 6px}
.ex details{grid-column:1/-1;font-size:14px}
.ex summary{cursor:pointer;font-weight:700;color:var(--m40-gris)}
.ex .kg{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.ex .kg input{width:64px;padding:8px;text-align:center}
.ex a.v{display:inline-block;margin-top:6px;font-size:13px;font-weight:800;color:#fff;background:var(--m40-negro);border-radius:999px;padding:5px 12px;text-decoration:none}
.list{list-style:none}.list li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--m40-borde);font-size:15px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--m40-borde);border-radius:14px;padding:14px;text-align:center}
.kpi b{display:block;font-size:26px;font-weight:900}.kpi span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--m40-gris)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--m40-borde);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;font-weight:800;font-size:13px;color:var(--m40-gris);cursor:pointer}
nav button.on{background:var(--m40-negro);color:#fff}
.hide{display:none!important}
.toast{pointer-events:none;position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--m40-negro);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;z-index:9}
.toast.on{opacity:1}
.err{color:var(--m40-rojo);font-weight:700;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="top"><div><img src="/*LOGO*/" alt="RENOVA"><br><b>MÉTODO 40</b></div><div class="who" id="who"></div></div>
<main id="app"></main>
<nav id="nav" class="hide">
  <button data-v="hoy">Hoy</button><button data-v="dolores">Dolores</button><button data-v="progreso">Progreso</button><button data-v="perfil">Perfil</button>
</nav>
<div class="toast" id="toast"></div>
<script>
const D = /*DATOS*/;
const KEY = "m40app_v1";
const OBJ = [["base", "Base general y mantenimiento", "Estar fuerte y sano todo el año"], ["hipertrofia", "Hipertrofia", "Ganar masa muscular"],
             ["fuerza", "Ganar fuerza", "Levantar más con buena técnica"], ["bajar", "Bajar de peso", "Perder grasa sin perder músculo"]];
const ZONAS = [["rodilla", "Rodilla"], ["lumbar", "Zona lumbar"], ["hombro", "Hombro"], ["cadera", "Cadera"], ["cuello", "Cuello"], ["muneca", "Codo o muñeca"]];
const NIV = {basico: "Básico", intermedio: "Intermedio", avanzado: "Avanzado"};
const $ = s => document.querySelector(s);
let S = load(), vista = "hoy";

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 1800); }
function esc(t) { return String(t ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
async function sha(t) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
const hoyISO = () => new Date().toISOString().slice(0, 10);

/* ---------- reglas ---------- */
function nivel() {
  if ((S.perfil.dolores || []).length) return "basico";
  let n = {menos1: "basico", "1a4": "intermedio", mas4: "avanzado"}[S.perfil.exp] || "basico";
  if (S.perfil.pausa === "si") n = n === "avanzado" ? "intermedio" : "basico";
  return n;
}
function momento() {
  const dias = Math.max(0, Math.floor((Date.now() - new Date(S.inicio + "T00:00:00")) / 864e5));
  const mes = Math.min(12, Math.floor(dias / 28) + 1), semana = Math.min(4, Math.floor((dias % 28) / 7) + 1);
  return {mes, semana, terminado: dias >= 336};
}
function proxima() { return "ABC"[(S.sesiones || []).length % 3]; }
function cambios() {
  const plan = D.planes[S.perfil.objetivo], lugar = S.perfil.lugar, out = {};
  for (const z of S.perfil.dolores || []) Object.assign(out, (plan.dolores[lugar] || {})[z] || {});
  return out;
}
function sesion() {
  const plan = D.planes[S.perfil.objetivo], {mes, semana} = momento(), m = plan.meses[mes - 1];
  const sem = m.semanas[semana - 1], niv = nivel(), cfg = plan.niveles[niv], r = proxima();
  const rut = m.rutinas[S.perfil.lugar][r], sw = cambios();
  const rirN = v => cfg.rir === "+1" ? String(v).replace(/\d+/g, d => Math.min(4, +d + 1)) : v;
  const centrales = rut.centrales.slice(0, cfg.centrales).map((b, k) => b.map(e => {
    const id = sw[e.id] || e.id;
    let series = (k === 0 && sem.series_central_1 ? sem.series_central_1 : sem.series) + cfg.series;
    if (k === 2) series = Math.min(series, 3);
    return {id, cambiado: id !== e.id, series: Math.max(1, series), reps: sem.reps, rir: rirN(sem.rir)};
  }));
  return {plan, m, sem, mes, semana, niv, cfg, r, centrales, calor: rut.entrada_en_calor, elong: rut.elongacion};
}

/* ---------- vistas ---------- */
function render() {
  $("#who").textContent = S.perfil ? `${S.perfil.nombre} · ${S.perfil.lugar === "casa" ? "Casa" : "Gimnasio"}` : "";
  $("#nav").classList.toggle("hide", !S.perfil);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === vista));
  document.body.classList.remove("wiz");
  if (!S.ok) return gate();
  if (!S.perfil) return onboarding();
  ({hoy, dolores, progreso, perfil})[vista]();
  scrollTo(0, 0);
}

function gate() {
  $("#app").innerHTML = `<h1>Tu código <span>de acceso</span></h1>
  <div class="card"><p class="muted">Está en tu ebook de MÉTODO 40. Lo ingresás una sola vez en este celular.</p>
  <label>Código</label><input id="code" autocomplete="off" autocapitalize="characters" placeholder="Tu código">
  <button class="btn" id="go">Entrar</button><p class="err hide" id="e">Código incorrecto. Revisalo en tu ebook.</p></div>`;
  $("#go").onclick = async () => {
    if (await sha($("#code").value.trim().toUpperCase()) === D.hash) { S.ok = true; save(); render(); } else $("#e").classList.remove("hide");
  };
}

const PASOS_ON = ["Tus datos", "Tu experiencia", "Cómo entrenás", "Tu objetivo", "Dolores"];
function onboarding() {
  const P = S.borrador || {dolores: [], dias: "3", lugar: "casa", objetivo: "base", paso: 0};
  const k = P.paso || 0;
  const chips = (key, ops) => ops.map(([v, t]) => `<button class="chip ${P[key] === v ? "on" : ""}" data-k="${key}" data-v="${v}">${t}</button>`).join("");
  const cuerpo = [
    () => `<label>Nombre</label><input id="nombre" value="${esc(P.nombre)}">
      <div class="row"><div><label>Edad</label><input id="edad" type="number" inputmode="numeric" value="${esc(P.edad)}"></div>
      <div><label>Altura (cm)</label><input id="altura" type="number" inputmode="numeric" value="${esc(P.altura)}"></div></div>
      <div class="row"><div><label>Peso (kg)</label><input id="peso" type="number" inputmode="decimal" value="${esc(P.peso)}"></div>
      <div><label>Cintura (cm)</label><input id="cintura" type="number" inputmode="decimal" value="${esc(P.cintura)}"></div></div>`,
    () => `<label>¿Cuánto hace que entrenás fuerza sin cortar?</label>
      <div class="chips">${chips("exp", [["menos1", "Menos de 1 año"], ["1a4", "De 1 a 4 años"], ["mas4", "Más de 4 años"]])}</div>
      <label style="margin-top:20px">¿Estuviste más de 6 meses sin entrenar hace poco?</label>
      <div class="chips">${chips("pausa", [["no", "No"], ["si", "Sí"]])}</div>`,
    () => `<label>Dónde entrenás</label><div class="chips">${chips("lugar", [["casa", "En casa"], ["gimnasio", "En el gimnasio"]])}</div>
      <label style="margin-top:20px">Días por semana</label><div class="chips">${chips("dias", [["2", "2 días"], ["3", "3 días"]])}</div>
      <p class="muted" style="margin-top:14px">Si un día entrenás de más, seguís con la próxima rutina (A → B → C).</p>`,
    () => OBJ.map(([v, t, d]) => { const ok = !!D.planes[v]; return `<button class="obj ${P.objetivo === v ? "on" : ""} ${ok ? "" : "off"}" data-o="${v}" ${ok ? "" : "disabled"}><b>${t}</b><small>${ok ? d : "Próximamente"}</small></button>`; }).join(""),
    () => `<p class="muted">Si marcás una zona, tu rutina se adapta sola: sin impacto, nivel básico y ejercicios que la cuidan. Si no te duele nada, seguí.</p>
      <div class="chips" style="margin-top:12px">${ZONAS.map(([v, t]) => `<button class="chip ${P.dolores.includes(v) ? "on" : ""}" data-z="${v}">${t}</button>`).join("")}</div>
      <label style="display:flex;gap:10px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:14px;color:var(--m40-negro);margin-top:18px">
      <input type="checkbox" id="apto" style="width:auto;margin-top:3px" ${P.apto ? "checked" : ""}> Tengo el apto médico para hacer actividad física y, si tengo una lesión reciente o un dolor fuerte, consulto antes de entrenar.</label>`,
  ];
  document.body.classList.add("wiz");
  $("#app").innerHTML = `<div class="pasos">${PASOS_ON.map((_, i) => `<i class="${i <= k ? "on" : ""}"></i>`).join("")}</div>
    <div class="paso-k">Paso ${k + 1} de ${PASOS_ON.length}</div><h1>${PASOS_ON[k].replace(/ (\S+)$/, " <span>$1</span>")}</h1>
    <div class="card">${cuerpo[k]()}</div><p class="err hide" id="e"></p>
    <div class="navp solo">${k ? `<button class="btn ghost" id="ant">Atrás</button>` : ""}<button class="btn" id="sig">${k === PASOS_ON.length - 1 ? "Armar mi plan" : "Siguiente"}</button></div>`;
  const keep = () => { for (const f of ["nombre", "edad", "altura", "peso", "cintura"]) if ($("#" + f)) P[f] = $("#" + f).value; if ($("#apto")) P.apto = $("#apto").checked; S.borrador = P; };
  const err = t => { $("#e").textContent = t; $("#e").classList.remove("hide"); };
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { keep(); P[b.dataset.k] = b.dataset.v; onboarding(); });
  document.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { keep(); P.objetivo = b.dataset.o; onboarding(); });
  document.querySelectorAll("[data-z]").forEach(b => b.onclick = () => { keep(); const z = b.dataset.z; P.dolores = P.dolores.includes(z) ? P.dolores.filter(x => x !== z) : [...P.dolores, z]; onboarding(); });
  if ($("#ant")) $("#ant").onclick = () => { keep(); P.paso = k - 1; onboarding(); };
  $("#sig").onclick = () => {
    keep();
    const falta = [
      () => !P.nombre ? "tu nombre" : !P.edad ? "tu edad" : !P.altura ? "tu altura" : !P.peso ? "tu peso" : !P.cintura ? "tu cintura" : "",
      () => !P.exp ? "cuánto hace que entrenás" : !P.pausa ? "si estuviste sin entrenar" : "",
      () => "", () => "", () => !P.apto ? "la confirmación del apto médico" : ""][k]();
    if (falta) return err("Falta completar " + falta + ".");
    if (k < PASOS_ON.length - 1) { P.paso = k + 1; S.borrador = P; save(); return onboarding(); }
    delete P.paso; S.perfil = P; delete S.borrador; S.inicio = hoyISO(); S.sesiones = []; S.medidas = [{fecha: hoyISO(), peso: +P.peso, cintura: +P.cintura}];
    save(); vista = "hoy"; render(); toast("¡Tu plan está listo!");
  };
  scrollTo(0, 0);
}

function exCard(e, dosis, kg) {
  const x = D.ej[e.id] || {n: e.id};
  return `<div class="ex"><img src="img/${esc(x.img)}.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div>
    <b>${esc(x.n)}</b><span class="mus">${esc(x.mus)}</span><br>
    ${dosis ? `<span class="dosis">${dosis}</span><br>` : ""}${e.cambiado ? `<span class="cambio">Adaptado por tu dolor</span><br>` : ""}
    ${x.url ? `<a class="v" href="${esc(x.url)}" target="_blank" rel="noopener">▶ Ver video</a>` : ""}</div>
    ${x.how ? `<details><summary>Cómo se hace</summary><p>${esc(x.how)}</p>${x.evita ? `<p><b>Evitá:</b> ${esc(x.evita)}</p>` : ""}</details>` : ""}
    ${kg ? `<div class="kg">${Array.from({length: e.series}, (_, i) => `<input placeholder="kg ${i + 1}" inputmode="decimal" data-ex="${e.id}" data-s="${i}" value="${esc(((S.tmp || {})[e.id] || [])[i] ?? "")}">`).join("")}</div>` : ""}
  </div>`;
}

function hoy() {
  const {mes, terminado} = momento();
  if (terminado) return fin12();
  const s = sesion(), nombreObj = OBJ.find(o => o[0] === S.perfil.objetivo)[1];
  const semTxt = s.semana === 4 ? "Semana 4 · descarga" : s.semana === 3 ? "Semana 3 · la más intensa" : `Semana ${s.semana}`;
  const dol = (S.perfil.dolores || []).length;
  const partes = [["Entrada en calor", "40 s cada uno", s.calor.map(e => exCard(e, "40 segundos")).join("")],
    ...s.centrales.map((b, k) => [`Central ${k + 1}`, `Descanso ${k === 0 ? s.m.descanso.central_1 : s.m.descanso.resto}`, b.map(e => exCard(e, `${e.series} × ${e.reps} · RIR ${e.rir}`, true)).join("")]),
    ...(s.m.extra ? [["Final: cardio", "", `<div class="card">${esc(s.m.extra)}</div>`]] : []),
    ["Elongación", "30 s cada una", s.elong.map(e => exCard(e, "30 segundos")).join("")]];
  const k = S.parte ?? -1;
  document.body.classList.add("wiz");
  if (k < 0) {
    $("#app").innerHTML = `
    <div class="hero"><div class="k">${esc(nombreObj)} · Mes ${mes} de 12</div>
      <div class="big">Rutina ${s.r}</div><div>${esc(s.m.fase)}: ${esc(s.m.objetivo)}</div>
      <span class="pill">${semTxt}</span><span class="pill" style="background:#fff;color:var(--m40-negro)">Nivel ${NIV[s.niv]} · ${s.cfg.duracion}</span></div>
    ${dol ? `<div class="alert"><b>Rutina adaptada por dolor.</b> Hoy entrenás sin impacto y en nivel básico. Si el dolor pasa de 3 sobre 10 o empeora al día siguiente, frená y consultá.
      <a class="btn" href="${D.wa}?text=${encodeURIComponent("Hola, soy " + S.perfil.nombre + " de MÉTODO 40. Quiero consultar con el equipo médico de RENOVA por un dolor.")}" target="_blank" rel="noopener">Consultar con el equipo médico de RENOVA</a></div>` : ""}
    ${s.semana === 4 ? `<div class="card"><b>Semana de descarga:</b> usá un 15 % menos de peso que en la semana 1. Es parte del plan: así seguís progresando.</div>` : ""}
    <div class="card"><b>Hoy hacés:</b><ul class="list">${partes.map(p => `<li><span>${p[0]}</span><span class="muted">${p[1]}</span></li>`).join("")}</ul></div>
    <div class="navp"><button class="btn" id="sig">Empezar</button></div>`;
  } else {
    const [t, sub, html] = partes[k];
    $("#app").innerHTML = `<div class="pasos">${partes.map((_, i) => `<i class="${i <= k ? "on" : ""}"></i>`).join("")}</div>
      <div class="paso-k">Rutina ${s.r} · Parte ${k + 1} de ${partes.length}</div>
      <div class="sec-h" style="margin-top:6px"><h2>${t.replace(/ (\S+)$/, " <span>$1</span>")}</h2><span>${sub}</span></div>${html}
      ${k === partes.length - 1 ? `<p class="muted" style="text-align:center;margin-top:8px">RIR = repeticiones que te quedan en reserva al terminar la serie.</p>` : ""}
      <div class="navp"><button class="btn ghost" id="ant">Atrás</button><button class="btn" id="sig">${k === partes.length - 1 ? "Terminar sesión" : "Siguiente"}</button></div>`;
  }
  document.querySelectorAll("[data-ex]").forEach(i => i.oninput = () => { ((S.tmp ||= {})[i.dataset.ex] ||= [])[+i.dataset.s] = i.value; save(); });
  if ($("#ant")) $("#ant").onclick = () => { S.parte = k - 1; save(); hoy(); };
  $("#sig").onclick = () => {
    if (k < partes.length - 1) { S.parte = k + 1; save(); hoy(); scrollTo(0, 0); return; }
    const cargas = {};
    for (const [id, arr] of Object.entries(S.tmp || {})) cargas[id] = arr.map(v => v ? +String(v).replace(",", ".") : null);
    S.sesiones.push({fecha: hoyISO(), rutina: s.r, mes: s.mes, semana: s.semana, cargas}); S.parte = -1; S.tmp = {}; save();
    toast(`¡Sesión ${S.sesiones.length} guardada!`); hoy(); scrollTo(0, 0);
  };
}

function fin12() {
  $("#app").innerHTML = `<h1>¡Terminaste <span>tus 12 meses!</span></h1>
  <div class="card"><p>Completaste tu plan anual. Elegí cómo seguir:</p>
  <a class="btn" href="${D.wa}?text=${encodeURIComponent("Hola, terminé mi año de MÉTODO 40 y quiero pasar al Nivel 2.")}" target="_blank" rel="noopener">Pasar al Nivel 2</a>
  <a class="btn sec" href="${D.wa}?text=${encodeURIComponent("Hola, terminé mi año de MÉTODO 40 y quiero un plan personalizado.")}" target="_blank" rel="noopener">Entrenamiento personalizado con Nacho</a></div>`;
}

function dolores() {
  const sel = S.perfil.dolores || [];
  $("#app").innerHTML = `<h1>Mis <span>dolores</span></h1>
  <p class="muted" style="margin-top:6px">Marcá dónde te duele. Tu rutina se adapta sola: sin impacto, nivel básico y ejercicios que cuidan esa zona. Cuando se te pase, desmarcala y volvés a tu plan.</p>
  <div class="card"><div class="chips">${ZONAS.map(([v, t]) => `<button class="chip ${sel.includes(v) ? "on" : ""}" data-z="${v}">${t}</button>`).join("")}</div></div>
  <div class="card"><b>Cuándo frenar y consultar</b>
    <ul style="margin:8px 0 0 18px;font-size:15px"><li>El dolor pasa de 3 sobre 10 durante el ejercicio.</li><li>Empeora al día siguiente.</li><li>Es una lesión de menos de 3 meses o el dolor baja por la pierna o el brazo.</li></ul>
    <a class="btn" href="${D.wa}?text=${encodeURIComponent("Hola, soy " + S.perfil.nombre + " de MÉTODO 40. Quiero consultar con el equipo médico de RENOVA.")}" target="_blank" rel="noopener">Consultar con el equipo médico de RENOVA</a></div>`;
  document.querySelectorAll("[data-z]").forEach(b => b.onclick = () => {
    const z = b.dataset.z; S.perfil.dolores = sel.includes(z) ? sel.filter(x => x !== z) : [...sel, z]; save(); dolores();
    toast(S.perfil.dolores.length ? "Rutina adaptada" : "Volviste a tu plan");
  });
}

function progreso() {
  const ses = S.sesiones || [], med = S.medidas || [], u = med[med.length - 1] || {}, p0 = med[0] || {};
  const dif = (a, b) => (a && b) ? (a - b > 0 ? "+" : "") + (a - b).toFixed(1) : "–";
  const {mes} = momento();
  $("#app").innerHTML = `<h1>Mi <span>progreso</span></h1>
  <div class="kpis" style="margin-top:12px">
    <div class="kpi"><b>${ses.length}</b><span>Sesiones</span></div><div class="kpi"><b>${mes}/12</b><span>Mes del plan</span></div>
    <div class="kpi"><b>${u.peso || "–"}</b><span>Peso (${dif(u.peso, p0.peso)} kg)</span></div><div class="kpi"><b>${u.cintura || "–"}</b><span>Cintura (${dif(u.cintura, p0.cintura)} cm)</span></div>
  </div>
  <div class="card"><h2>Cargar <span>medidas</span></h2><p class="muted">Una vez por semana, en ayunas.</p>
    <div class="row"><div><label>Peso (kg)</label><input id="mp" inputmode="decimal"></div><div><label>Cintura (cm)</label><input id="mc" inputmode="decimal"></div></div>
    <button class="btn sec" id="gm">Guardar medidas</button></div>
  <div class="card"><h2>Mis <span>entrenamientos</span></h2>
    <ul class="list">${ses.slice().reverse().slice(0, 30).map(x => `<li><span>${x.fecha}</span><span>Rutina ${x.rutina} · Mes ${x.mes} · Sem ${x.semana}</span></li>`).join("") || "<li>Todavía no terminaste ninguna sesión.</li>"}</ul></div>`;
  $("#gm").onclick = () => {
    const p = +$("#mp").value.replace(",", "."), c = +$("#mc").value.replace(",", ".");
    if (!p && !c) return toast("Cargá peso o cintura");
    S.medidas.push({fecha: hoyISO(), peso: p || u.peso, cintura: c || u.cintura}); save(); progreso(); toast("Medidas guardadas");
  };
}

function perfil() {
  const P = S.perfil;
  $("#app").innerHTML = `<h1>Mi <span>perfil</span></h1>
  <div class="card"><ul class="list">
    <li><span>Nombre</span><b>${esc(P.nombre)}</b></li><li><span>Edad</span><b>${esc(P.edad)}</b></li><li><span>Altura</span><b>${esc(P.altura)} cm</b></li>
    <li><span>Nivel</span><b>${NIV[nivel()]}</b></li><li><span>Objetivo</span><b>${esc(OBJ.find(o => o[0] === P.objetivo)[1])}</b></li>
    <li><span>Entrena</span><b>${P.lugar === "casa" ? "En casa" : "En el gimnasio"} · ${P.dias} días</b></li><li><span>Inicio del plan</span><b>${S.inicio}</b></li></ul>
    <label>Cambiar dónde entreno</label><div class="chips">${[["casa", "En casa"], ["gimnasio", "En el gimnasio"]].map(([v, t]) => `<button class="chip ${P.lugar === v ? "on" : ""}" data-l="${v}">${t}</button>`).join("")}</div></div>
  <div class="card"><h2>Antropometría <span>profesional</span></h2><p class="muted">Evaluación completa con Nacho, presencial en CABA y Provincia de Buenos Aires.</p>
    <a class="btn sec" href="${D.wa}?text=${encodeURIComponent("Hola, quiero coordinar una antropometría completa.")}" target="_blank" rel="noopener">Pedir información</a></div>
  <button class="btn ghost" id="reset">Borrar mis datos y empezar de nuevo</button>
  <p class="muted" style="text-align:center;margin-top:10px">Tus datos se guardan solo en este celular.</p>`;
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { P.lugar = b.dataset.l; save(); render(); });
  $("#reset").onclick = e => {
    const b = e.currentTarget;
    if (b.dataset.seguro) { S = {ok: true}; save(); render(); return; }
    b.dataset.seguro = "1"; b.textContent = "Tocá de nuevo para borrar todo (plan, sesiones y medidas)"; b.style.background = "var(--m40-rojo)"; b.style.color = "#fff";
  };
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { vista = b.dataset.v; render(); });
render();
</script>
</body>
</html>
