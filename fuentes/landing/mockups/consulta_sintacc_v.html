*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:var(--h);overflow:hidden;font-family:IT,sans-serif;color:#fff;position:relative;
 background:radial-gradient(ellipse 80% 50% at 50% 38%,rgba(20,177,199,.35),transparent 70%),linear-gradient(165deg,#06343B,#075E6B)}
.marco{position:absolute;inset:26px;border:16px solid #14B1C7;border-radius:40px;box-shadow:0 0 0 6px #6FD8E6,inset 0 0 0 6px #6FD8E6,0 0 60px rgba(20,177,199,.6)}
.in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--pt) 90px 0}
.logo{height:52px;filter:brightness(0) invert(1)}
.tag{margin-top:24px;background:#14B1C7;font:900 26px IT;letter-spacing:.14em;padding:10px 30px;border-radius:999px}

.duo{display:flex;gap:40px;margin-top:var(--gap)}
.p{width:400px;background:rgba(255,255,255,.08);border:2px solid rgba(111,216,230,.55);border-radius:30px;padding:26px 22px}
.p img{width:var(--ph);height:var(--ph);border-radius:50%;object-fit:cover;object-position:50% 22%;border:7px solid #14B1C7;box-shadow:0 0 30px rgba(20,177,199,.6)}
.p b{display:block;font:900 36px/1.1 IT;margin-top:16px}
.p span{display:block;font:700 25px/1.3 I;color:#BDEFF5;margin-top:6px}
.p i{display:inline-block;margin-top:14px;font:800 26px IT;font-style:normal;background:#fff;color:#06343B;padding:8px 18px;border-radius:12px}
.plus{position:absolute;left:50%;top:var(--plus);transform:translateX(-50%);width:84px;height:84px;border-radius:50%;background:#14B1C7;font:900 64px/80px IT;box-shadow:0 0 0 8px #06343B}
.inc{margin-top:var(--gap);background:#fff;color:#06343B;font:900 40px IT;padding:18px 44px;border-radius:999px;text-transform:uppercase;box-shadow:0 14px 34px rgba(0,0,0,.35)}
